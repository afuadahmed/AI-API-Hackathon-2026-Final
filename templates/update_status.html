{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-lg-6">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3 class="mb-0">

Update Report Status

</h3>

</div>

<div class="card-body">

<h4>{{ report.title }}</h4>

<p>

<strong>Tracking Code:</strong>

{{ report.tracking_code }}

</p>

<form method="POST">

{% csrf_token %}

<label class="form-label">

Status

</label>

<select
class="form-select"
name="status">

<option value="Pending"
{% if report.status == "Pending" %}selected{% endif %}>

Pending

</option>

<option value="In Progress"
{% if report.status == "In Progress" %}selected{% endif %}>

In Progress

</option>

<option value="Resolved"
{% if report.status == "Resolved" %}selected{% endif %}>

Resolved

</option>

</select>

<div class="d-grid mt-4">

<button
class="btn btn-success">

Save Changes

</button>

</div>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
